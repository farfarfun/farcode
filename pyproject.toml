[project]
name = "funcode"
version = "0.0.10"
description = "funcode"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "funget>=1.1.67",
    "funshell>=1.0.19",
    "farlog>=1.1.3",
]

[project.optional-dependencies]
# AttentionDecoder.py 依赖已停止维护的旧版独立 keras 包（非 tensorflow.keras），
# 在现代 TensorFlow/Keras 版本下大概率无法直接运行，故单独拆到 extras 不作为默认依赖。
legacy-dl = ["tensorflow", "keras"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funcode"]
