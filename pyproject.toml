[project]
name = "farcode"
version = "0.0.10"
description = "farfarfun 深度学习与数据处理代码合集"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "funget>=1.1.67",
    "funshell>=1.0.19",
    "farlog>=1.1.7",
]

# 这里曾有一个 legacy-dl = ["tensorflow>=2.16", "keras>=3.0"] extra，声称给
# attention_decoder.py 用。它装不出能跑的环境：该模块要的是 keras.engine.InputSpec
# 和 keras.layers.recurrent.Recurrent，二者自 Keras 2.4 起已删除，Keras 3 连
# keras.engine 子包都没有；而最后提供它们的 Keras 2.2.x/2.3.x + TensorFlow 1.15 只
# 支持到 Python 3.7，与 requires-python >= 3.12 没有交集。留着等于用 keras>=3.0
# 伪装兼容，故删除。attention_decoder.py 现在只是历史参考代码，导入时会抛出一条
# 说明现状的 ImportError，不属于 farcode 的公开 API。

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/farcode"]
